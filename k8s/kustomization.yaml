apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-app

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Secrets will be created separately via CI/CD or manually
# Do not include secrets.yaml in version control

commonLabels:
  app.kubernetes.io/name: demo-app
  app.kubernetes.io/version: v1.0.0
  app.kubernetes.io/managed-by: kustomize
