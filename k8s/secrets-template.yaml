# Template for creating secrets - DO NOT commit actual secrets to version control
# Use this template to create your actual secrets.yaml file

apiVersion: v1
kind: Secret
metadata:
  name: demo-app-secrets
  namespace: demo-app
type: Opaque
data:
  # Replace these with your actual base64 encoded values
  # Example: echo -n 'your-username' | base64
  db-username: <BASE64_ENCODED_USERNAME>
  db-password: <BASE64_ENCODED_PASSWORD>
  db-name: <BASE64_ENCODED_DATABASE_NAME>

# Create secrets using:
# kubectl apply -f secrets.yaml

# Or create secrets using kubectl command:
# kubectl create secret generic demo-app-secrets \
#   --from-literal=db-username=postgres \
#   --from-literal=db-password=1234 \
#   --from-literal=db-name=sample \
#   --namespace=demo-app
